<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Makeup Jhada — monograma MJ con corona">
  <!-- Recreación vectorial provisional del logo: reemplazar por el archivo original del negocio -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3DE9A"/>
      <stop offset=".45" stop-color="#C9A84C"/>
      <stop offset="1" stop-color="#8E6B23"/>
    </linearGradient>
    <radialGradient id="bg" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#5A2A28"/>
      <stop offset="1" stop-color="#3D1C1C"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#g)" stroke-width="1.6"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#g)" stroke-width=".6" opacity=".7"/>
  <!-- Corona -->
  <g fill="url(#g)">
    <path d="M70 66 L76 44 L88 58 L100 38 L112 58 L124 44 L130 66 Z"/>
    <rect x="70" y="67" width="60" height="5" rx="2"/>
    <circle cx="76" cy="42" r="3.2"/><circle cx="100" cy="35.5" r="3.6"/><circle cx="124" cy="42" r="3.2"/>
  </g>
  <!-- Monograma -->
  <text x="100" y="138" text-anchor="middle" font-family="'Cormorant Garamond','Playfair Display',Georgia,serif" font-size="66" font-weight="600" font-style="italic" fill="url(#g)" letter-spacing="-4">MJ</text>
  <text x="100" y="162" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="8.5" letter-spacing="3.2" fill="#F5E6DA" opacity=".85">BEAUTY STUDIO</text>
</svg>
